<link rel="stylesheet" href="/components/galerie.css">
<section class="gallery" id="galerie">
    <div class="gallery-inner">
        <div class="gallery-header">
            <span class="gallery-pill">GALERIE</span>
            <h2 class="gallery-title">Naše produkty</h2>
            <p class="gallery-subtitle">Prohlédněte si naše realizace a nechte se inspirovat</p>
        </div>
        <div class="cards" data-gallery>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(40px) rotate(-6deg);"><img src="https://picsum.photos/seed/gs1/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(20px) rotate(-3deg);"><img src="https://picsum.photos/seed/ga2/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(0px) rotate(0deg);"><img src="https://picsum.photos/seed/gl3/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(20px) rotate(3deg);"><img src="https://picsum.photos/seed/ge4/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(40px) rotate(6deg);"><img src="https://picsum.photos/seed/gr5/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(20px) rotate(3deg);"><img src="https://picsum.photos/seed/gi6/800/800" alt=""></div>
            </div>
            <div class="card-wrapper">
                <div class="card" style="transform: translateY(0px) rotate(0deg);"><img src="https://picsum.photos/seed/ge7/800/800" alt=""></div>
            </div>
        </div>

        <div class="lightbox" id="lightbox">
            <span class="arrow left" id="prev">&#10094;</span>
            <img id="lightbox-img" src="" alt="">
            <span class="arrow right" id="next">&#10095;</span>
            <span class="close-btn" id="close-lightbox">&#10005;</span>
        </div>
    </div>
</section>
